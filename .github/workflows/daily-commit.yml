name: Daily Commit Bot

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run commit script
        run: |
          git config --global user.name "Salvador9111"
          git config --global user.email "zalimhammad978@gmail.com"

          python commit_bot.py

          git add activity.log

          if ! git diff --cached --quiet; then
            git commit -m "Daily activity: $(date +%Y-%m-%d)"
            git push
          else
            echo "Nothing to commit"
          fi
