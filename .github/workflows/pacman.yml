name: Generate Pac-Man

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Pac-Man SVGs from my contribution graph
        run: node generate-pacman.mjs ${{ github.repository_owner }}
        env:
          # swap for a PAT (read:user) secret to include private contributions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to pacman-output branch
        run: |
          cd dist
          git init -q -b pacman-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update pacman"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pacman-output
